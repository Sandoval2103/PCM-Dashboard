<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hub PCM</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub PCM</title>
    
    <!-- === ESTA ES LA LÍNEA NUEVA PARA EL FAVICON === -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root {
            --bg-dark: #121212;
            --brand-gold: #d4af37;
            --text-main: #ffffff;
            --alert-red: #ff4c4c;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1e1e1e;
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid var(--brand-gold);
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }
        h2 {
            color: var(--brand-gold);
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--brand-gold);
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 15px;
            transition: 0.3s;
            font-family: inherit;
        }
        button:hover {
            background: #b5952f;
            transform: scale(1.02);
        }
        .msg {
            color: var(--alert-red);
            margin-top: 15px;
            font-size: 0.9em;
            height: 20px;
        }

                /* === ANIMACIÓN DE CARGA === */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(0,0,0,0.3);
            border-radius: 50%;
            border-top-color: black; /* Color del borde que gira */
            animation: girar 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes girar {
            to { transform: rotate(360deg); }
        }
        
        /* Efecto para cuando el botón está bloqueado */
        button:disabled {
            background: #a38629;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ACCESO</h2>
        <input type="text" id="user" placeholder="Usuario" autocomplete="off" onkeypress="detectarEnter(event)">
        <input type="password" id="pass" placeholder="Contraseña" onkeypress="detectarEnter(event)">
        <button onclick="iniciarSesion()" id="btn-login">INGRESAR</button>
        <div id="mensaje" class="msg"></div>
    </div>

    <script>
        // PEGA AQUÍ TU NUEVA URL DE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbyKeVzWjqYRNo58g2OHp8A8uuWDBuDQtT5t6Gp0eWypt2DAHw5g6FtnST3G_tb_Kjwx/exec"; 

        function detectarEnter(event) {
    // Si la tecla presionada es 'Enter' (código 13 o 'Enter')
    if (event.key === "Enter" || event.keyCode === 13) {
        event.preventDefault(); // Evita recargas raras de la página
        iniciarSesion();        // Dispara el inicio de sesión
    }
}
        
        async function iniciarSesion() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const btn = document.getElementById('btn-login');
            const msg = document.getElementById('mensaje');
            
            if(!u || !p) { 
                msg.textContent = "[!] Llena todos los campos"; 
                return; 
            }
            
          // Agregamos el circulito y bloqueamos el botón
            btn.innerHTML = '<span class="spinner"></span> VERIFICANDO...';
            btn.disabled = true;
            msg.textContent = "";
            
            try {
                const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // <-- EL PASAPORTE
                body: JSON.stringify({ action: "login", usuario: u, password: p })
                });
                const data = await res.json();
                
                if(data.status === "success") {
                    sessionStorage.setItem("acceso_concedido", "true");
                    window.location.href = "index.html"; 
                } else {
                    msg.textContent = "[!] Usuario o contraseña incorrectos";
                    // Regresamos el botón a la normalidad
                    btn.innerHTML = "INGRESAR";
                    btn.disabled = false;
                }
            } catch(e) {
                msg.textContent = "[!] Error de conexión";
                // Regresamos el botón a la normalidad
                btn.innerHTML = "INGRESAR";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
